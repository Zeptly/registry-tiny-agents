name: validate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Validate registry roots (schema, semantics, privacy scan, attestations, policy)
        run: npm run validate
      - name: Index is up to date and deterministic
        run: npm run index:check
      - name: Published canonical versions are immutable
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin "${{ github.base_ref }}"
          npx tsx tools/src/cli.ts check-immutability --base "origin/${{ github.base_ref }}"
